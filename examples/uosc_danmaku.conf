# WiSukia 改版通用示例。复制到 mpv 配置目录的 script-opts/uosc_danmaku.conf。
# 已有配置请合并所需选项，避免覆盖自己的设置。
# 原项目提供的代理服务；网络可用性取决于第三方。
api_server=https://danmaku-api.152468.xyz
auto_load=no
fps=60
fontname=sans-serif
fontsize=50
bold=yes
outline=1
shadow=0
scrolltime=15
fixtime=5
opacity=0.7
displayarea=0.85
merge_screen_duplicates=yes
merge_window=15
# Windows 可选：fontname=Microsoft YaHei；高刷新率屏幕可尝试 fps=120。
